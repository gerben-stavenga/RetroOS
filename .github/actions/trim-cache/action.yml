name: Trim Bazel cache
description: Keep the newest 3 GiB before saving the build cache.
runs:
  using: composite
  steps:
    - name: Trim bazel disk cache
      shell: bash
      run: |
        if [ -d ~/.cache/bazel-disk ]; then
          du -sh ~/.cache/bazel-disk || true
          # Cache entries have content-hash filenames without spaces.
          find ~/.cache/bazel-disk -type f -printf '%A@ %s %p\n' 2>/dev/null |
            sort -rn |
            awk -v budget=$((3*1024*1024*1024)) '{tot+=$2; if (tot>budget) print $3}' |
            xargs -r rm -f
          du -sh ~/.cache/bazel-disk || true
        fi
        df -h /
