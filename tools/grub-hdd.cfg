# GRUB menu for the RetroOS hard-disk image (tools/build_grub_hdd.py).
#
# The kernel's multiboot header asks for a linear framebuffer; `gfxpayload`
# is what makes GRUB hand one over rather than leaving the card in text mode.
# fbcon then renders the console into it (kernel/src/arch/fbcon.rs).
set timeout=0
set default=0

insmod all_video
set gfxmode=1024x768x32
set gfxpayload=keep

menuentry "RetroOS" {
    multiboot /boot/kernel.elf
    boot
}
