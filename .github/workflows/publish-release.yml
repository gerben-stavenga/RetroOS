name: Publish rolling release
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.target_sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.TARGET_SHA }}
    - name: Verify CI run
      run: |
        test "$(gh run view "$RUN_ID" --json workflowName --jq .workflowName)" = CI
        test "$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)" = success
        test "$(gh run view "$RUN_ID" --json headSha --jq .headSha)" = "$TARGET_SHA"
    - name: Download tested assets
      run: gh run download "$RUN_ID" --name "retroos-$TARGET_SHA" --dir release
    - name: Verify checksums
      run: cd release && sha256sum -c SHA256SUMS
    - name: Upload release assets
      run: |
        gh release upload retroos \
          release/retroos-vm.tar.gz \
          release/retroos-machine.tar.gz \
          release/retroos_grub_module_usb.zip \
          release/retroos_grub_module.iso \
          release/retroos-usb-diagnostic.zip \
          release/SHA256SUMS THIRD_PARTY_LICENSES.md --clobber
    - name: Point rolling tag at tested commit
      run: |
        gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/retroos" \
          -f sha="$TARGET_SHA" -F force=true
    - name: Update rolling release details
      run: |
        cat > release/rolling-notes.md <<EOF
        Rolling RetroOS build from [$TARGET_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$TARGET_SHA).

        These assets passed [CI run $RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID), including lint, unit and integration tests, release packaging, and BIOS/UEFI boot checks.

        See the [changelog](https://github.com/$GITHUB_REPOSITORY/blob/$TARGET_SHA/CHANGELOG.md) for release notes. Download checksums are in SHA256SUMS.
        EOF
        gh release edit retroos --title "RetroOS — rolling build (${TARGET_SHA:0:8})" \
          --notes-file release/rolling-notes.md --latest=false
'on':
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI run containing tested release assets
        required: true
        type: string
      target_sha:
        description: Commit tested by that CI run
        required: true
        type: string
concurrency:
  group: publish-rolling-release
  cancel-in-progress: false
