name: Publish rolling release
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_sha }}
    - name: Verify CI run
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ inputs.run_id }}
        TARGET_SHA: ${{ inputs.target_sha }}
      run: |
        test "$(gh run view "$RUN_ID" --json workflowName --jq .workflowName)" = CI
        test "$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)" = success
        test "$(gh run view "$RUN_ID" --json headSha --jq .headSha)" = "$TARGET_SHA"
    - name: Download tested assets
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ inputs.run_id }}
        TARGET_SHA: ${{ inputs.target_sha }}
      run: gh run download "$RUN_ID" --name "retroos-$TARGET_SHA" --dir release
    - name: Verify checksums
      run: cd release && sha256sum -c SHA256SUMS
    - name: Upload release assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload retroos \
          release/retroos-vm.tar.gz \
          release/retroos-machine.tar.gz \
          release/retroos_grub_module_usb.img \
          release/retroos_grub_module.iso \
          release/retroos-usb-diagnostic.zip \
          release/SHA256SUMS --clobber
    - name: Point rolling tag at tested commit
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ inputs.target_sha }}
      run: |
        gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/retroos" \
          -f sha="$TARGET_SHA" -F force=true
'on':
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI run containing tested release assets
        required: true
        type: string
      target_sha:
        description: Commit tested by that CI run
        required: true
        type: string
concurrency:
  group: publish-rolling-release
  cancel-in-progress: false
