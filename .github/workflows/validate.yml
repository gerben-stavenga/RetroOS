name: Validate RetroOS
'on':
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      package_release:
        default: false
        type: boolean
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  quality:
    name: Lint and unit tests
    # Pin the build image: the legacy pkg-config bootstrap requires pre-C23 defaults.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.commit }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-build
    - name: Clippy (metal crates)
      run: |
        bazel build --config=clippy \
          //kernel:kernel //lib:lib //lib:sound //third_party/smb2-core \
          //arch-abi:arch-abi //arch-metal:arch-metal
    - name: Clippy (host crates)
      run: |
        bazel build --config=clippy --platforms=@platforms//host \
          //kernel:kernel //kernel:retroos-host \
          //kernel:retroos-host-kvm //arch-interp:arch-interp-kvm \
          //arch-interp:arch-interp //lib:lib //lib:sound //arch-abi:arch-abi
    - name: Unit tests
      run: |
        filters=-requires-qemu-kvm
        if [ "$RETRO_REQUIRE_KVM" != 1 ]; then filters="$filters,-requires-kvm"; fi
        bazel test //tests:unit --test_tag_filters="$filters" --test_output=errors
    - name: Trim build cache
      if: always()
      uses: ./.github/actions/trim-cache
  runtime:
    name: Integration (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [boot, dos, personalities, devices]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.commit }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-build
    - name: Integration tests
      env:
        SUITE: ${{ matrix.suite }}
      run: |
        # Hosted KVM runs whenever /dev/kvm is available. Firmware KVM tests
        # require a capable local runner; hosted nested KVM cannot boot them.
        filters=-requires-qemu-kvm
        if [ "$RETRO_REQUIRE_KVM" != 1 ]; then filters="$filters,-requires-kvm"; fi
        bazel test "//tests:$SUITE" --test_tag_filters="$filters" \
          --test_output=errors
    - name: Preserve test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ inputs.commit }}-${{ matrix.suite }}-${{ github.run_attempt }}
        path: |
          bazel-testlogs/tests/**/test.log
          bazel-testlogs/tests/**/test.xml
        if-no-files-found: ignore
        retention-days: 14
    - name: Trim build cache
      if: always()
      uses: ./.github/actions/trim-cache
  package:
    name: Release images and boot checks
    if: inputs.package_release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.commit }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/setup-build
    - name: Build and validate release artifacts
      run: |
        bazel test //tests:release --test_output=errors
        mkdir -p build/release
        cp bazel-bin/retroos-vm.tar.gz bazel-bin/retroos-machine.tar.gz bazel-bin/retroos_grub_module_usb.zip bazel-bin/retroos_grub_module.iso bazel-bin/retroos-usb-diagnostic.zip bazel-bin/SHA256SUMS build/release/
    - name: Upload tested public releases
      uses: actions/upload-artifact@v4
      with:
        name: retroos-${{ inputs.commit }}
        overwrite: true
        path: |
          build/release/retroos-vm.tar.gz
          build/release/retroos-machine.tar.gz
          build/release/retroos_grub_module_usb.zip
          build/release/retroos_grub_module.iso
          build/release/retroos-usb-diagnostic.zip
          build/release/SHA256SUMS
        if-no-files-found: error
        compression-level: 0
        retention-days: 30
    - name: Trim build cache
      if: always()
      uses: ./.github/actions/trim-cache
  required:
    name: Required checks
    if: always()
    needs:
    - quality
    - runtime
    - package
    runs-on: ubuntu-24.04
    steps:
    - name: Check all results
      env:
        QUALITY: ${{ needs.quality.result }}
        RUNTIME: ${{ needs.runtime.result }}
        PACKAGE: ${{ needs.package.result }}
        PACKAGE_REQUIRED: ${{ inputs.package_release }}
      run: |-
        test "$QUALITY" = success
        test "$RUNTIME" = success
        if [ "$PACKAGE_REQUIRED" = true ]; then test "$PACKAGE" = success; fi
