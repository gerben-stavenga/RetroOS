# GRUB menu for the RetroOS hard-disk image (tools/build_grub_hdd.py).
#
# BIOS uses native video services; UEFI uses the boot framebuffer.
set timeout=0
set default=0

# `ram-overlay`: this entry boots a machine with a REAL disk on it, so divert
# every physical write into volatile RAM and leave the medium untouched. Drop
# the argument when you want RetroOS to actually write to this disk. Nothing
# else turns it on — the kernel writes by default, and only this line asks it
# not to.
menuentry "RetroOS (disk protected)" {
    multiboot2 /boot/kernel.elf ram-overlay
    # multiboot2 resets gfxpayload from the kernel header; override it here.
    if [ "$grub_platform" = "pc" ]; then
        set gfxpayload=text
    else
        insmod all_video
        set gfxmode=auto
        set gfxpayload=keep
    fi
    boot
}

menuentry "RetroOS (disk WRITABLE)" {
    multiboot2 /boot/kernel.elf
    if [ "$grub_platform" = "pc" ]; then
        set gfxpayload=text
    else
        insmod all_video
        set gfxmode=auto
        set gfxpayload=keep
    fi
    boot
}
