set timeout=5
set default=1
# Native BIOS boots keep hardware VGA, including planar and Mode X modes.
if [ "$grub_platform" = "pc" ]; then
    set gfxpayload=text
else
    insmod all_video
    set gfxmode=auto
    set gfxpayload=keep
fi

menuentry "RetroOS (diskless base)" {
    multiboot /boot/kernel.elf
    insmod gzio
    module /boot/retroos-base.img.gz retroos.mount=/
    boot
}

menuentry "RetroOS (diskless base + games)" {
    multiboot /boot/kernel.elf
    insmod gzio
    module /boot/retroos-base.img.gz retroos.mount=/
    module /boot/retroos-games.img.gz retroos.mount=/home/retroos/GAMES
    boot
}
