# User settings. Edit this ordinary file; upgrades preserve it.
# Filesystem mounts and bundle selection belong in BOOT.INI.

[system]
start=C:\DN\DN.COM

[locale]
language=en-US
#keyboard=us
#codepage=437

# Hardware RTC convention; local preserves traditional DOS behavior.
# For a UTC RTC, set rtc=utc and your local offset, e.g. utc_offset=-07:00.
# The offset is fixed; update it when daylight saving time changes.
[clock]
rtc=local
utc_offset=+00:00

# DOS framebuffer scaling, applied at boot. The OSD can change it for the session.
# Modes: original_aspect, fill_screen, sharp_pixels, square_pixels.
[display]
scaling=original_aspect

[sound]
sb_audio=native
hda_output=Speaker
volume=50

# Native WPA2-Personal Wi-Fi. Uncomment and supply your own credentials.
# [wifi]
# ssid=MyNetwork
# password=your-password
# autoconnect=true

[environment]
DNSWP=C:\TEMP
TEMP=C:\TEMP
DN=C:\DN
VC=C:\COMMANDER\VC
MCHOME=C:\COMMANDER\MC
HOME=C:\COMMANDER\MC
COMSPEC=C:\RETROOS\COMMAND.COM
PATH=C:\;C:\RETROOS;C:\TC;C:\BORLANDC\BIN
ADLIB=A388
BLASTER=A220 I7 D1 H5 P330 T6
ULTRASND=240,3,3,5,5
ULTRADIR=C:\ULTRASND

# Linux entry settings are separate from the DOS environment above.
# BOOT.INI [session] home selects the Linux home independently of C:.
# shell.elf supplies HOME/bin, /usr/local/bin and the system directories in PATH,
# HOME/TEMP as TMPDIR, SHELL=/bin/sh and TERM=linux. Explicit values override them.
[linux.environment]
#HOME=/home/alice
#PATH=/home/alice/bin:/usr/local/bin:/usr/bin:/bin
#CODEX_HOME=/home/alice/.codex

# Per-program DOS launch overrides. Basenames are case-insensitive.
# Saved edits apply on the next shell launch of a program; no reboot needed.
# Combine loadfix, dos32a, repair, iopl3 and xms32k with spaces.
# loadfix: load above 64 KiB for EXEPACK; dos32a: wrap with DOS/32A.
# repair: honor virtual IF via tagged flags; iopl3: step all IF-off code.
# xms32k: cap classic XMS reports at 32767 KiB; the pool stays unlimited.
# Keep launch entries under 79 bytes for COMMAND.COM's line buffer.
[launch]
F22.EXE=repair cpu25
CHESS.EXE=loadfix
CALGAMES.EXE=loadfix
TDH.EXE=loadfix
DIGGER.COM=loadfix
CAT.EXE=loadfix
GAME.EXE=loadfix
DOOM.EXE=repair
DOOM2.EXE=repair
DJDOOM.EXE=repair
HEXEN.EXE=repair
DUKE3D.EXE=repair
ROTT.EXE=repair
TYRIAN.EXE=repair
QUAKE.EXE=repair
WOLF3D.EXE=repair
HOCUS.EXE=repair
RAP.EXE=repair
KEEN1.EXE=repair
KEEN4E.EXE=repair
SKYROADS.EXE=repair
DIGGER.EXE=repair
DEMO.EXE=repair
WW.EXE=repair
DM.EXE=repair
SLIPSTRM.EXE=repair
MM2.EXE=repair
ALADDIN.EXE=xms32k
