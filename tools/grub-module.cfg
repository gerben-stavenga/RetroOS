set timeout=5
set default=0

function boot_modules {
    multiboot /boot/kernel.elf $3
    # multiboot applies the header's text-mode request; override it afterward.
    set gfxpayload="$2"
    insmod gzio
    module /boot/retroos-base.img.gz retroos.mount=/
    if [ "$1" = "games" ]; then
        module /boot/retroos-games.img.gz retroos.mount=/home/retroos/GAMES
    fi
    boot
}

function boot_choices {
    # The firmware decides BIOS versus UEFI. BIOS also offers native VGA;
    # both firmware paths can use the framebuffer/software VGA renderer.
    if [ "$grub_platform" = "pc" ]; then
        menuentry "RetroOS (protected disk, native BIOS VGA)" "$1" {
            boot_modules "$2" text ram-overlay
        }
        menuentry "RetroOS (persistent disk, native BIOS VGA)" "$1" {
            boot_modules "$2" text
        }
        set framebuffer_name="VBE framebuffer"
        set framebuffer_payload=1024x768x32,800x600x32
    else
        set framebuffer_name="GOP framebuffer"
        set framebuffer_payload=auto
    fi
    menuentry "RetroOS (protected disk, $framebuffer_name)" "$1" {
        insmod all_video
        boot_modules "$2" "$framebuffer_payload" ram-overlay
    }
    menuentry "RetroOS (persistent disk, $framebuffer_name)" "$1" {
        insmod all_video
        boot_modules "$2" "$framebuffer_payload"
    }
}

boot_choices games
submenu "Base only (lower RAM use)" {
    boot_choices base
}
