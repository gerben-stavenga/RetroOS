name: CI
on: push
concurrency:
  group: release-ci-diagnostics
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Minimal diagnostic tools
      run: |
        sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends nasm samba samba-common-bin
        python3 -m pip install --break-system-packages -r test/requirements.txt
        sudo chmod a+rw /dev/kvm
        sudo curl -fsSL -o /usr/local/bin/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64
        sudo chmod +x /usr/local/bin/bazelisk
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel-disk
          ~/.cache/bazel-repo
        key: diagnostic-unused
        restore-keys: bazel-Linux-
    - run: |
        echo 'build --disk_cache=~/.cache/bazel-disk' >> ~/.bazelrc
        echo 'build --repository_cache=~/.cache/bazel-repo' >> ~/.bazelrc
    - name: Diagnose Samba
      env:
        SMB_TEST_SUDO: '1'
      run: |
        python3 test/smb.py || true
        sudo journalctl -k --no-pager | tail -60
    - name: Diagnose editor
      run: python3 test/rat_commander.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics
        path: build/ci/*.log
