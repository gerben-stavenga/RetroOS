name: CI
on: push
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-build
    - name: Diagnose Samba
      env:
        SMB_TEST_SUDO: '1'
      run: |
        python3 test/smb.py || true
        sudo journalctl -k --no-pager | tail -60
    - name: Diagnose editor
      run: python3 test/rat_commander.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostics
        path: build/ci/*.log
