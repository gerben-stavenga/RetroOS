set timeout=5
set default=0
export retroos_release

# With no filename, multiboot2 clears the loaded image. On a module failure
# this prevents GRUB's implicit boot when the menu entry returns.
function boot_modules {
    if ! multiboot2 $retroos_release/kernel.elf $3 $4 $5; then multiboot2; return; fi
    # multiboot2 applies the framebuffer request; override it afterward.
    set gfxpayload="$2"
    insmod gzio
    if ! module2 $retroos_release/retroos-base.img.gz retroos.mount=/; then multiboot2; return; fi
    if ! module2 /boot/retroos/BOOT.INI retroos.config=boot; then multiboot2; return; fi
    if [ -f /boot/retroos/RETROOS.INI ]; then
        if ! module2 /boot/retroos/RETROOS.INI retroos.config=ini; then multiboot2; return; fi
    fi
    if [ "$1" = "showcase" ]; then
        if ! module2 $retroos_release/retroos-showcase.img.gz retroos.mount=/showcase; then multiboot2; return; fi
    fi
    boot
}

function boot_choices {
    # The firmware decides BIOS versus UEFI. BIOS also offers native VGA;
    # both firmware paths can use the framebuffer/software VGA renderer.
    if [ "$grub_platform" = "pc" ]; then
        menuentry "RetroOS (protected disk, native BIOS VGA)" "$1" {
            boot_modules "$2" text ram-overlay
        }
        menuentry "RetroOS (persistent disk, native BIOS VGA)" "$1" {
            boot_modules "$2" text
        }
        set framebuffer_name="VBE framebuffer"
        set framebuffer_payload=1024x768x32,800x600x32
    else
        set framebuffer_name="GOP framebuffer"
        set framebuffer_payload=auto
    fi
    menuentry "RetroOS (protected disk, $framebuffer_name)" "$1" {
        insmod all_video
        boot_modules "$2" "$framebuffer_payload" ram-overlay
    }
    menuentry "RetroOS (persistent disk, $framebuffer_name)" "$1" {
        insmod all_video
        boot_modules "$2" "$framebuffer_payload"
    }
}

set retroos_content=base
if [ -f $retroos_release/retroos-showcase.img.gz ]; then
    set retroos_content=showcase
    boot_choices showcase
    submenu "Core only (less RAM)" { boot_choices base }
else
    boot_choices base
fi
export retroos_content
if [ "$grub_platform" = "efi" ]; then
    menuentry "RetroOS (protected disk, GOP 1024x768)" {
        insmod all_video
        set gfxmode=1024x768x32
        boot_modules "$retroos_content" 1024x768x32 ram-overlay
    }
    menuentry "RetroOS (protected disk, GOP 800x600)" {
        insmod all_video
        set gfxmode=800x600x32
        boot_modules "$retroos_content" 800x600x32 ram-overlay
    }
fi
submenu "Boot diagnostics (no DN; stop for photo)" {
    if [ "$grub_platform" = "pc" ]; then
        menuentry "Protected disk, native BIOS VGA" {
            boot_modules base text ram-overlay boot-log-only
        }
        set photo_payload=1024x768x32,800x600x32
    else
        set photo_payload=auto
    fi
    menuentry "Protected disk, framebuffer" {
        insmod all_video
        boot_modules base "$photo_payload" ram-overlay boot-log-only
    }
    menuentry "Persistent disk, framebuffer (save KLOG)" {
        insmod all_video
        boot_modules base "$photo_payload" boot-log-only
    }
}

submenu "dISAppointment ISA bridge (supported Intel + Fintek only)" {
    if [ "$grub_platform" = "pc" ]; then
        menuentry "Protected disk, native BIOS VGA + ISA bridge setup" {
            boot_modules base text ram-overlay isa-lpc=disappointment
        }
    fi
    menuentry "Protected disk, framebuffer + ISA bridge setup" {
        insmod all_video
        boot_modules base auto ram-overlay isa-lpc=disappointment
    }
    menuentry "ISA diagnostics (no DN; stop for photo)" {
        insmod all_video
        boot_modules base auto ram-overlay boot-log-only isa-lpc=disappointment
    }
}
