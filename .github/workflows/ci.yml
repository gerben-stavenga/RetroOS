name: CI
'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - '**'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/validate.yml
    with:
      commit: ${{ github.sha }}
      package_release: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
